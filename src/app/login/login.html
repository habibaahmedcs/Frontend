<div class="auth-container">
  <div class="auth-card">
    <h2>تسجيل الدخول</h2>
    <p class="form_h">مرحباً بك مجدداً في موقعنا</p>

    <div *ngIf="errorMessage" style="color: #ff6b6b; margin-bottom: 15px; font-weight: bold;">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="أدخل بريدك الإلكتروني" 
          required>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="أدخل كلمة المرور" 
          required>
      </div>

      <button type="submit" class="auth-btn">
        تسجيل الدخول
      </button>
    </form>

    <div class="auth-links">
      <p>
        ليس لديك حساب؟ 
        <a routerLink="/signup">سجل الآن</a>
      </p>
    </div>
  </div>
</div>
