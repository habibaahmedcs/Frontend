<nav class="nav">
  <div class="nav-left">
    <div class="logo">
      <a routerLink="/home" routerLinkActive="active" class="logo-link">
        <img src="../../assets/images/logo.png" alt="Logo">
        <span>مذاق مصر</span>
      </a>
    </div>
  </div>

  <div class="nav-center">
    <a routerLink="/homefood" routerLinkActive="active">الأكل البيتي</a>
    <a routerLink="/restaurants" routerLinkActive="active">المطاعم</a>
    <a routerLink="/about" routerLinkActive="active">من نحن</a> 
  </div>

  <div class="nav-right">
    @if (isLoggedIn) {
      <div class="nav-links profile-section">
        <div class="profile-dropdown">
          <div class="profile-info-container">
            <span class="username-display">{{ userName }}</span>
            <div class="avatar-circle">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3d142c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <span class="dropdown-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5c2244" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </div>
          
          <div class="profile-menu">
            @if (isAdmin) {
              <a routerLink="/admin">لوحة التحكم</a>
            }

            @if (isApprovedOwner || hasRejectedListing) {
              <a routerLink="/vendor-dashboard">إدارة مطعمي</a>
            } @else if (hasPendingRequest) {
              <a routerLink="/vendor-dashboard">الطلب قيد المراجعة</a>
            } @else {
              <a routerLink="/aprove-restaurant">طلب انضمام مطعم</a>
            }

            <a routerLink="/profile">البروفايل</a>
            <a routerLink="/settings">الإعدادات</a>
          </div>
        </div>

        <button (click)="logout()" class="header-logout-btn">
          تسجيل الخروج
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    } @else {
      <div class="nav-links">
        <a routerLink="/login" routerLinkActive="active">تسجيل الدخول</a>
        <a routerLink="/signup" routerLinkActive="active">إنشاء حساب</a>
      </div>
    }
  </div>
</nav>
